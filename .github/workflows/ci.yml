name: ci

on:
  push:
  pull_request:

jobs:
  attribution:
    name: no AI attribution in commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-history.sh

  check:
    name: lint, typecheck, dependency rules, tests, build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest version package.json "engines" allows, and the newest 24.x.
        node: ["22.22.2", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  sidecar:
    name: python sidecar tests, without the model runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --directory bridge/python --frozen --group dev pytest
